<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8bdbb" />
    <meta
      name="description"
      content="BIABYSS — 변화하는 현미경 배양액에서 살아남는 세포 생존 게임"
    />
    <title>BIABYSS</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <div id="game-surface" class="game-surface" aria-hidden="true"></div>
      <div class="optics" aria-hidden="true"></div>

      <header class="top-bar">
        <div class="brand-block">
          <span class="specimen-mark"><i></i></span>
          <div>
            <strong>BIABYSS</strong>
            <small>LIVE SPECIMEN / 400×</small>
          </div>
        </div>

        <div class="hud" aria-live="polite">
          <div><span>MASS</span><strong id="mass-value">36.0</strong></div>
          <div><span>ABSORBED</span><strong id="absorbed-value">0</strong></div>
          <div><span>FIELD</span><strong id="field-value">36×</strong></div>
        </div>
      </header>

      <aside class="field-map" aria-hidden="true">
        <div class="field-map__label"><span>FIELD POSITION</span><b id="position-value">50 / 50</b></div>
        <div class="field-map__track"><i id="field-cursor"></i></div>
      </aside>

      <section id="start-panel" class="start-panel">
        <p class="eyebrow"><span></span> BRIGHT-FIELD CULTURE 07</p>
        <h1 id="panel-title">ENTER THE<br /><em>LIVING FIELD</em></h1>
        <p id="panel-copy">현미경 배양액 속에서 한 발씩 수축하며 작은 생명체를 흡수하세요.<br />크기와 진한 윤곽으로 포식자를 구별할 수 있습니다.</p>
        <button id="start-button" type="button"><span>표본 관찰 시작</span><i>→</i></button>
        <small>PRESS / DRAG JOYPAD TO MOVE · SPACE TO PAUSE</small>
      </section>

      <footer class="footer-bar">
        <div><span id="status-light" class="status-light"></span><b id="status-copy">SPECIMEN STABLE</b></div>
        <div class="scale"><i></i><span>50 μm</span></div>
      </footer>

      <p id="live-region" class="sr-only" aria-live="assertive"></p>
      <output id="diagnostics" hidden></output>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
