name: Web quality

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: biabyss-apps/.nvmrc
          cache: npm
          cache-dependency-path: biabyss-apps/package-lock.json

      - name: Install locked dependencies
        working-directory: biabyss-apps
        run: npm ci

      - name: Check mobile workspace
        working-directory: biabyss-apps
        run: npm run check
